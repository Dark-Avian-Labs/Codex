version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '00:00'
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      production-dependencies:
        dependency-type: 'production'
      development-dependencies:
        dependency-type: 'development'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '00:00'
    # Floating @vN tags already track minor/patch; cooldown + full semver PRs
    # can "downgrade" relative to the retargeted major tag.
    cooldown:
      default-days: 1
      exclude:
        - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'ci'
      include: 'scope'
