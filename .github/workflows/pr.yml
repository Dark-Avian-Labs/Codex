name: Codex PR Checks

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: 26

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  repair-dependabot-lockfile:
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}

    steps:
      - name: Checkout PR branch
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - name: Restore catalog specifiers in lockfile
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile

          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          git commit -m "chore(deps): restore catalog specifiers in pnpm-lock.yaml"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  validate:
    needs: [repair-dependabot-lockfile]
    if: >
      always() &&
      !cancelled() &&
      (
        needs.repair-dependabot-lockfile.result == 'skipped' ||
        (
          needs.repair-dependabot-lockfile.result == 'success' &&
          needs.repair-dependabot-lockfile.outputs.pushed != 'true'
        )
      )
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          require-lockfile: true

      - name: Prepare test environment
        env:
          DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOPMENT }}
        run: |
          if [ -n "${DOTENV_PRIVATE_KEY_DEVELOPMENT:-}" ]; then
            echo "USE_DOTENVX=true" >> "$GITHUB_ENV"
          else
            echo "USE_DOTENVX=false" >> "$GITHUB_ENV"
            cp .github/ci.env.development .env.development
            DB_ROOT="${RUNNER_TEMP}/codex-ci-db"
            mkdir -p "$DB_ROOT"
            {
              echo ""
              echo "# CI-only absolute DB paths (core rejects relative SESSION_DB_PATH)"
              echo "SESSION_DB_PATH=${DB_ROOT}/session.test.db"
              echo "ARMORY_DB_PATH=${DB_ROOT}/armory.test.db"
              echo "WARFRAME_DB_PATH=${DB_ROOT}/warframe.test.db"
              echo "EPIC7_DB_PATH=${DB_ROOT}/epic7.test.db"
              echo "WOR_DB_PATH=${DB_ROOT}/wor.test.db"
            } >> .env.development
            echo "::notice title=CI env::No DOTENV_PRIVATE_KEY_DEVELOPMENT (Dependabot/forks). Using .github/ci.env.development plus RUNNER_TEMP DB paths. Optional: add this secret under Settings → Secrets and variables → Actions → Dependabot to use the committed encrypted .env.development instead."
          fi

      - name: Run quality checks
        env:
          DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOPMENT }}
        run: |
          if [ "$USE_DOTENVX" = "true" ]; then
            pnpm exec dotenvx run --strict -f .env.development -- pnpm run validate
          else
            pnpm run validate
          fi

      - name: Build project
        env:
          DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOPMENT }}
        run: |
          if [ "$USE_DOTENVX" = "true" ]; then
            pnpm exec dotenvx run --strict -f .env.development -- pnpm run build
          else
            pnpm run build
          fi

      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run end-to-end tests
        run: pnpm run test:e2e
