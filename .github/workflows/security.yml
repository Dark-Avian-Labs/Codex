name: Dependency audit

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: 26

on:
  schedule:
    - cron: '13 6 * * 1'
  pull_request:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/security.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Decide whether to audit
        id: filter
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
            | python3 -c "import json,sys; print('\n'.join(f['filename'] for f in json.load(sys.stdin)))")"
          echo "Changed files:"
          echo "$changed"

          if echo "$changed" | grep -Eq '(^|/)(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$|^\.github/workflows/security\.yml$'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No dependency files changed; skipping pnpm audit"
          fi

      - name: Checkout code
        if: steps.filter.outputs.skip != 'true'
        uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1.7.0

      - name: Setup pnpm and Node.js
        if: steps.filter.outputs.skip != 'true'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: false
          install: false

      - name: Audit dependencies
        if: steps.filter.outputs.skip != 'true'
        run: pnpm audit --audit-level high

  security:
    name: security
    needs: [audit]
    if: always() && !cancelled()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5

    steps:
      - name: Check audit result
        shell: bash
        run: |
          result="${{ needs.audit.result }}"
          if [ "$result" = "success" ]; then
            exit 0
          fi
          echo "Audit job result: $result"
          exit 1
