name: Approve Dependabot follow-up checks

on:
  workflow_run:
    workflows: ['Codex PR Checks']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  approve:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5

    steps:
      - name: Approve waiting Codex PR Checks
        env:
          GH_TOKEN: ${{ secrets.CI_PAT }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "CI_PAT is missing or empty."
            exit 1
          fi

          waiting_ids() {
            gh run list --workflow 'Codex PR Checks' --branch "$BRANCH" --event pull_request --limit 20 \
              --json databaseId,status,conclusion \
              --jq '.[] | select(.status == "waiting" or .conclusion == "action_required") | .databaseId'
          }

          for _ in 1 2 3 4 5 6; do
            ids="$(waiting_ids)"
            if [ -n "$ids" ]; then
              while IFS= read -r id; do
                [ -z "$id" ] && continue
                gh api --method POST "repos/${GH_REPO}/actions/runs/${id}/approve"
              done <<< "$ids"
              exit 0
            fi
            sleep 5
          done

          echo "No waiting Codex PR Checks runs for $BRANCH"
